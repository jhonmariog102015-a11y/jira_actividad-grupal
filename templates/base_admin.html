<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel Administrativo | ADSO Gestión{% endblock title %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            color: #495057;
            font-weight: 500;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background-color: #e9ecef;
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Barra Superior del Panel Administrativo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/inventario/">
                <i class="bi bi-shield-lock-fill text-warning me-2"></i>ADSO AdminPanel
            </a>
            <span class="navbar-text text-white-50 d-none d-md-inline">
                <i class="bi bi-gear-wide-connected me-1"></i>Módulo de Gestión Empresarial
            </span>
            <div class="d-flex align-items-center">
                <span class="badge bg-primary me-3 px-3 py-2">
                    <i class="bi bi-person-circle me-1"></i>SysAdmin
                </span>
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-left me-1"></i>Ver Portal Público
                </a>
            </div>
        </div>
    </nav>

    <!-- Estructura del Panel con Barra Lateral (Sidebar) y Contenido -->
    <div class="container-fluid">
        <div class="row">
            <!-- Menú Lateral de Navegación Modular -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar py-4 px-3">
                <div class="position-sticky">
                    <h6 class="text-uppercase text-muted fw-bold mb-3 px-2" style="font-size: 0.75rem; letter-spacing: 0.05rem;">
                        Navegación Modular
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active px-3 py-2" href="/inventario/">
                                <i class="bi bi-box-seam me-2 text-primary"></i>Inventario
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2" href="/inventario/productos/">
                                <i class="bi bi-card-list me-2 text-secondary"></i>Catálogo Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2" href="/admin/">
                                <i class="bi bi-database-gear me-2 text-warning"></i>Django Admin
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 text-muted" href="#" onclick="alert('Módulo de Usuarios en construcción'); return false;">
                                <i class="bi bi-people me-2"></i>Usuarios
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3 py-2 text-muted" href="#" onclick="alert('Módulo de Reportes en construcción'); return false;">
                                <i class="bi bi-graph-up-arrow me-2"></i>Reportes
                            </a>
                        </li>
                    </ul>

                    <hr class="my-4">

                    <div class="px-2">
                        <a class="btn btn-sm btn-outline-danger w-100 fw-semibold" href="/">
                            <i class="bi bi-door-closed me-1"></i>Cerrar Sesión
                        </a>
                    </div>
                </div>
            </nav>

            <!-- Área de Contenido Principal -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                {% endblock content %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
